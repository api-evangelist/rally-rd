name: Rally Rd
description: >-
  Rally (formerly Rally Rd.) is a New York-based alternative-asset investment
  platform that lets everyday investors buy and sell equity shares in collectible
  assets — classic cars, watches, art, wine, sports memorabilia, natural-history
  artifacts, musical instruments and first-edition books. Rally sources and
  authenticates each item, registers it with the SEC as a security through
  FINRA/SIPC registered broker-dealer partners, splits it into equity shares, and
  opens an Initial Offering in its iOS, Android and web app where investors of all
  sizes can buy in from as little as $50 and later trade via in-app Bid/Ask.
  Rally was surfaced as a portfolio company of Anthemis. It publishes no public
  developer API or developer portal; this profile captures its verified public
  identity and web properties.
